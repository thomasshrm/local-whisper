[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-whisper"
version = "0.1.0"
description = "Offline transcription desktop application foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
playback = ["sounddevice==0.5.6"]

[project.gui-scripts]
local-whisper = "local_whisper.__main__:main"

[tool.setuptools.packages.find]
include = ["local_whisper*"]
